<section class="page">
  @if (loading()) {
    <div class="state-block">
      <mat-spinner diameter="40" />
      <span>Carregando período letivo…</span>
    </div>
  } @else if (notFound()) {
    <app-empty-state
      message="Período letivo não encontrado."
      actionLabel="Voltar à lista"
      (action)="router.navigate(['/periodos-letivos'])"
    />
  } @else if (item(); as periodo) {
    <header class="page__header">
      <div>
        <h1 class="page__title">{{ periodo.codigo }}</h1>
      </div>
      <div class="page__actions">
        <a mat-stroked-button [routerLink]="['/periodos-letivos', periodo.id, 'editar']">
          <mat-icon>edit</mat-icon>
          Editar
        </a>
        <button mat-stroked-button color="warn" type="button" (click)="excluir()">
          <mat-icon>delete</mat-icon>
          Excluir
        </button>
        <a mat-button routerLink="/periodos-letivos">Voltar</a>
      </div>
    </header>

    <dl class="detail-grid">
      <dt>Código</dt>
      <dd>{{ periodo.codigo }}</dd>
      <dt>Data início</dt>
      <dd>{{ periodo.dataInicio }}</dd>
      <dt>Data término</dt>
      <dd>{{ periodo.dataTermino }}</dd>
      <dt>Situação</dt>
      <dd>
        <app-status-chip
          [label]="Labels.situacaoPeriodo(periodo.situacao)"
          [highlighted]="periodo.situacao === 'ABERTO'"
        />
      </dd>
    </dl>
  }
</section>
