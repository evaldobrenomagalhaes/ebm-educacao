<section class="section-block">
  <div class="section-block__header">
    <h2 class="section-block__title">Matrículas</h2>
    <a mat-flat-button color="primary" [routerLink]="novaLink()" [queryParams]="novaQuery()">
      Nova matrícula
    </a>
  </div>

  @if (loading()) {
    <div class="state-block">
      <mat-spinner diameter="32" />
      <span>Carregando matrículas…</span>
    </div>
  } @else if (items().length === 0) {
    <app-empty-state message="Nenhuma matrícula." />
  } @else {
    <div class="table-wrap">
      <table mat-table [dataSource]="items()" class="mat-elevation-z0">
        <ng-container matColumnDef="aluno">
          <th mat-header-cell *matHeaderCellDef>Aluno</th>
          <td mat-cell *matCellDef="let row">
            <div class="cell-stack">
              <span class="cell-primary">{{ row.alunoNome }}</span>
              <span class="cell-secondary" [title]="row.alunoId">{{ row.alunoId | slice: 0 : 8 }}…</span>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="disciplina">
          <th mat-header-cell *matHeaderCellDef>Disciplina</th>
          <td mat-cell *matCellDef="let row">{{ row.disciplinaNome }}</td>
        </ng-container>

        <ng-container matColumnDef="turma">
          <th mat-header-cell *matHeaderCellDef>Turma</th>
          <td mat-cell *matCellDef="let row">{{ row.turmaCodigo }}</td>
        </ng-container>

        <ng-container matColumnDef="periodo">
          <th mat-header-cell *matHeaderCellDef>Período letivo</th>
          <td mat-cell *matCellDef="let row">{{ row.periodoCodigo }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let row">
            <app-status-chip
              [label]="Labels.statusMatricula(row.status)"
              [highlighted]="row.status === 'CONFIRMADA'"
            />
          </td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <a mat-button color="primary" [routerLink]="['/matriculas', row.id]">Ver</a>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>
      </table>
    </div>
  }
</section>
