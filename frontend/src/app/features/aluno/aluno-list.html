<section class="page">
  <header class="page__header">
    <h1 class="page__title">Alunos</h1>
    <div class="page__actions">
      <a mat-flat-button color="primary" routerLink="/alunos/novo">
        <mat-icon>add</mat-icon>
        Novo aluno
      </a>
    </div>
  </header>

  <form class="filters" [formGroup]="filterForm" (ngSubmit)="filtrar()">
    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="nome" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>E-mail</mat-label>
      <input matInput formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Situação acadêmica</mat-label>
      <mat-select formControlName="situacaoAcademica">
        <mat-option value="">Todas</mat-option>
        <mat-option value="ATIVO">Ativo</mat-option>
        <mat-option value="INATIVO">Inativo</mat-option>
      </mat-select>
    </mat-form-field>

    <div class="filters__actions">
      <button mat-flat-button color="primary" type="submit">Filtrar</button>
      <button mat-stroked-button type="button" (click)="limpar()">Limpar</button>
    </div>
  </form>

  @if (loading()) {
    <div class="state-block">
      <mat-spinner diameter="40" />
      <span>Carregando alunos…</span>
    </div>
  } @else if (error()) {
    <div class="state-block">
      <p>{{ error() }}</p>
      <button mat-stroked-button type="button" (click)="load()">Tentar novamente</button>
    </div>
  } @else if (items().length === 0) {
    <app-empty-state
      message="Nenhum aluno encontrado."
      actionLabel="Novo aluno"
      (action)="router.navigate(['/alunos', 'novo'])"
    />
  } @else {
    <div class="table-wrap">
      <table mat-table [dataSource]="items()" class="mat-elevation-z0">
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let row">{{ row.nome }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>E-mail</th>
          <td mat-cell *matCellDef="let row">{{ row.email }}</td>
        </ng-container>

        <ng-container matColumnDef="situacaoAcademica">
          <th mat-header-cell *matHeaderCellDef>Situação</th>
          <td mat-cell *matCellDef="let row">
            <app-status-chip
              [label]="Labels.situacaoAcademica(row.situacaoAcademica)"
              [highlighted]="row.situacaoAcademica === 'ATIVO'"
            />
          </td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <button mat-button type="button" color="primary" (click)="$event.stopPropagation(); ver(row.id)">
              Ver
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          (click)="ver(row.id)"
          style="cursor: pointer"
        ></tr>
      </table>
    </div>
  }
</section>
