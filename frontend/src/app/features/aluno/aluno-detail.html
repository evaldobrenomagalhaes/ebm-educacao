<section class="page">
  @if (loading()) {
    <div class="state-block">
      <mat-spinner diameter="40" />
      <span>Carregando aluno…</span>
    </div>
  } @else if (notFound()) {
    <app-empty-state
      message="Aluno não encontrado."
      actionLabel="Voltar à lista"
      (action)="router.navigate(['/alunos'])"
    />
  } @else if (item(); as aluno) {
    <header class="page__header">
      <div>
        <h1 class="page__title">{{ aluno.nome }}</h1>
      </div>
      <div class="page__actions">
        <a mat-stroked-button [routerLink]="['/alunos', aluno.id, 'editar']">
          <mat-icon>edit</mat-icon>
          Editar
        </a>
        <button mat-stroked-button color="warn" type="button" (click)="excluir()">
          <mat-icon>delete</mat-icon>
          Excluir
        </button>
        <a mat-button routerLink="/alunos">Voltar</a>
      </div>
    </header>

    <dl class="detail-grid">
      <dt>Nome</dt>
      <dd>{{ aluno.nome }}</dd>
      <dt>E-mail</dt>
      <dd>{{ aluno.email }}</dd>
      <dt>Situação acadêmica</dt>
      <dd>
        <app-status-chip
          [label]="Labels.situacaoAcademica(aluno.situacaoAcademica)"
          [highlighted]="aluno.situacaoAcademica === 'ATIVO'"
        />
      </dd>
    </dl>

    <app-matricula-panel [alunoId]="aluno.id" />
  }
</section>
