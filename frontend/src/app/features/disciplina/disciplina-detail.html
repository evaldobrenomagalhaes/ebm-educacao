<section class="page">
  @if (loading()) {
    <div class="state-block">
      <mat-spinner diameter="40" />
      <span>Carregando disciplina…</span>
    </div>
  } @else if (notFound()) {
    <app-empty-state
      message="Disciplina não encontrada."
      actionLabel="Voltar à lista"
      (action)="router.navigate(['/disciplinas'])"
    />
  } @else if (item(); as disciplina) {
    <header class="page__header">
      <div>
        <h1 class="page__title">{{ disciplina.nome }}</h1>
      </div>
      <div class="page__actions">
        <a mat-stroked-button [routerLink]="['/disciplinas', disciplina.id, 'editar']">
          <mat-icon>edit</mat-icon>
          Editar
        </a>
        <button mat-stroked-button color="warn" type="button" (click)="excluir()">
          <mat-icon>delete</mat-icon>
          Excluir
        </button>
        <a mat-button routerLink="/disciplinas">Voltar</a>
      </div>
    </header>

    <dl class="detail-grid">
      <dt>Nome</dt>
      <dd>{{ disciplina.nome }}</dd>
      <dt>Código</dt>
      <dd>{{ disciplina.codigo }}</dd>
      <dt>Curso</dt>
      <dd>{{ cursoNome() }}</dd>
      <dt>Curso ID</dt>
      <dd>{{ disciplina.cursoId }}</dd>
    </dl>
  }
</section>
