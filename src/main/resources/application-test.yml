spring:
  datasource:
    # Sobrescrito por Testcontainers em AbstractIntegrationTest (@DynamicPropertySource).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ebm-edu}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin@123}
  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    br.com.academico: INFO

app:
  cors:
    allowed-origins: http://localhost:4200
