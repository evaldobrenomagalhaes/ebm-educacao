spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ebm-edu
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin@123}
  jpa:
    show-sql: true
  flyway:
    # Schema (db/migration) + carga de cenários de teste (db/testdata).
    # Profiles test/prod usam apenas db/migration (application.yml).
    locations: classpath:db/migration,classpath:db/testdata

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    br.com.academico: DEBUG
    org.hibernate.SQL: DEBUG

app:
  cors:
    allowed-origins: http://localhost:4200
