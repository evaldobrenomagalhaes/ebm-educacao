spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    br.com.academico: INFO

app:
  cors:
    # Lista vazia por padrão; definir CORS_ALLOWED_ORIGINS com origins reais (separadas por vírgula).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
